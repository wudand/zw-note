host: localhost:8004
info:
  contact: {}
  description: RESTful API for PC admin and WeChat mini-program
  title: zw-note-backend
  version: "1.0"
paths:
  /api/admin/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/zw-note-backend_internal_dto.AdminLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/zw-note-backend_pkg_utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/zw-note-backend_internal_dto.AdminLoginResponse'
              type: object
      summary: Admin login
      tags:
      - admin-auth
  /api/admin/v1/carousels:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/zw-note-backend_pkg_utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/zw-note-backend_internal_dto.CarouselListResponse'
              type: object
      security:
      - BearerAuth: []
      summary: List all carousels
      tags:
      - admin-carousels
    post:
      consumes:
      - application/json
      parameters:
      - description: Create payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/zw-note-backend_internal_dto.CreateCarouselRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/zw-note-backend_pkg_utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/zw-note-backend_internal_dto.CarouselResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Create a new carousel
      tags:
      - admin-carousels
  /api/admin/v1/carousels/{id}:
    delete:
      parameters:
      - description: Carousel ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/zw-note-backend_pkg_utils.Response'
      security:
      - BearerAuth: []
      summary: Delete a carousel
      tags:
      - admin-carousels
    get:
      parameters:
      - description: Carousel ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/zw-note-backend_pkg_utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/zw-note-backend_internal_dto.CarouselResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Get carousel by ID
      tags:
      - admin-carousels
    put:
      consumes:
      - application/json
      parameters:
      - description: Carousel ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/zw-note-backend_internal_dto.UpdateCarouselRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/zw-note-backend_pkg_utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/zw-note-backend_internal_dto.CarouselResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Update a carousel
      tags:
      - admin-carousels
  /api/admin/v1/categories:
    get:
      parameters:
      - description: Page (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 10)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/zw-note-backend_pkg_utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/zw-note-backend_internal_dto.CategoryListResponse'
              type: object
      security:
      - BearerAuth: []
      summary: List categories with pagination
      tags:
      - admin-categories
    post:
      consumes:
      - application/json
      parameters:
      - description: Create payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/zw-note-backend_internal_dto.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/zw-note-backend_pkg_utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/zw-note-backend_internal_dto.CategoryResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Create a new product category
      tags:
      - admin-categories
  /api/admin/v1/categories/{id}:
    delete:
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/zw-note-backend_pkg_utils.Response'
      security:
      - BearerAuth: []
      summary: Delete a category
      tags:
      - admin-categories
    get:
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/zw-note-backend_pkg_utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/zw-note-backend_internal_dto.CategoryResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Get category by ID
      tags:
      - admin-categories
    put:
      consumes:
      - application/json
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/zw-note-backend_internal_dto.UpdateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/zw-note-backend_pkg_utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/zw-note-backend_internal_dto.CategoryResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Update a category
      tags:
      - admin-categories
  /api/admin/v1/coupons:
    get:
      parameters:
      - description: Page (default 1)
        in: query
        name: page
        type: integer
      - description: Page size (default 10)
        in: query
        name: page_size
        type: integer
      - description: 'Filter: new_user | spend_reduce'
        in: query
        name: type
        type: string
      - description: 'Filter: 0 | 1'
        in: query
        name: status
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/zw-note-backend_pkg_utils.Response'
            - properties:
                data:
                  $ref: '#/definitions/zw-note-backend_internal_dto.CouponListResponse'
              type: object
      security:
      - BearerAuth: []
      summary: List coupons with pagination
