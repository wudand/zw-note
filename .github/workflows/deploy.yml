name: Deploy

# 推送到 main 分支时：构建后端/前端镜像 → 推送到 Docker Hub → SSH 到服务器 pull & 重启
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_NAMESPACE: wudande
  BACKEND_IMAGE: wudande/zw-note-backend
  FRONTEND_IMAGE: wudande/zw-note-frontend

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 构建上下文为仓库根目录，与 docker/README.md 的约定一致
      - name: Build & push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # 需要在仓库 Settings → Secrets and variables → Actions 里配置：
      #   DOCKERHUB_USERNAME  Docker Hub 用户名
      #   DOCKERHUB_TOKEN     Docker Hub Access Token（Docker Hub → Account Settings → Security）
      #   SSH_HOST            服务器地址
      #   SSH_USER            SSH 登录用户名
      #   SSH_PRIVATE_KEY     SSH 私钥（PEM 格式全文）
      #   SSH_PORT            SSH 端口（可选，默认 22）
      #   DEPLOY_PATH         服务器上仓库所在目录（已 clone 好，且已配置 docker/.env）
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.5
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -e
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull --ff-only
            docker compose -f docker/docker-compose.yml pull
            docker compose -f docker/docker-compose.yml up -d
            docker image prune -f
