name: Deploy

# 推送到 main 分支时：构建后端/前端镜像 → 推送到 Docker Hub → SSH 到服务器 pull & 重启
on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKERHUB_NAMESPACE: wudande
  BACKEND_IMAGE: wudande/zw-note-backend
  FRONTEND_IMAGE: wudande/zw-note-frontend

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 构建上下文为仓库根目录，与 docker/README.md 的约定一致
      - name: Build & push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 需要在仓库 Settings → Secrets and variables → Actions 里配置：
      #   SSH_HOST            服务器地址
      #   SSH_USER            SSH 登录用户名
      #   SSH_PRIVATE_KEY     SSH 私钥（PEM 格式全文）
      #   SSH_PORT            SSH 端口（可选，默认 22）
      #   DEPLOY_PATH         服务器上一个普通目录的绝对路径（如 /root/wudan/zw-note-deploy），
      #                       不需要 git clone，首次部署前只需手动在该目录下放好 .env
      #                       （从 docker/.env.example 复制并按需修改）
      #
      # 不依赖服务器上有 git 仓库：docker-compose.yml 由本步骤直接从 CI 传过去，
      # 每次部署都会覆盖更新；.env 不在传输范围内，不会被覆盖。
      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "docker/docker-compose.yml"
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1
          overwrite: true

      # 注意：wudande/zw-note-backend、wudande/zw-note-frontend 需保持 public，
      # 否则 docker compose pull 会因未登录而拉取失败，需要重新加回 docker login 步骤。
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            docker compose pull
            docker compose up -d
            docker image prune -f
